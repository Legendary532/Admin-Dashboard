<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dash.css">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.1/css/boxicons.min.css" rel="stylesheet">
    <script src="dash.js"></script>
    <script src="orders.js"></script>
    <title>Analytics Sale</title>
</head>
<body>
    <div class="container" style="display: flex; justify-content: center; margin-top: 20px;" >
        <div class="menu-toggle" id="menu-toggle-btn">
            <i class='bx bx-menu'></i>  <!-- Menu Icon (hamburger) -->
        </div>
        <aside class="hide">
            <div class="top">
                <div class="logo">
                    <img src="logo.webp">
                    <h2>EGA<span class="danger">TOR</span></h2>
                </div>
                <div class="close" id="close-btn">
                    <i class='bx bx-message-square-x'></i>
                </div>
            </div>
            <div class="sidebar">
                <a href="index.html">
                    <i class='bx bxs-dashboard'></i>
                    <h3>Dashboard</h3>
                </a>
                <a href="Dashboard.html">
                    <i class='bx bxs-contact'></i>
                    <h3>All</h3>
                </a>
                <a href="msg.html">
                    <i class='bx bx-receipt'></i>
                    <h3>Customers</h3>
                </a>
                <a href="ana.html" class="active">
                    <i class='bx bx-analyse'></i>
                    <h3>Analytics</h3>
                </a>
                <a href="msg.html">
                    <i class='bx bx-envelope'></i>
                    <h3>Messages</h3>
                    <span class="message-count">26</span>
                </a>
                <a href="prod.html">
                    <i class='bx bxl-product-hunt'></i>
                    <h3>Products</h3>
                </a>
                <a href="report.html">
                    <i class='bx bxs-report'></i>
                    <h3>Reports</h3>
                </a>
                <a href="add_prod.html">
                    <i class='bx bx-plus'></i>
                    <h3>Add Product</h3>
                </a>
                <a href="set.html">
                    <i class='bx bx-log-out'></i>
                    <h3>Logout</h3>
                </a>
            </div>
        </aside>

        <div class="right">
            <div class="top"  style=" margin-left: auto; width: 800px;" >
                <button id="menu-btn">
                    <i class='bx bx-menu'></i>
                </button>
                <div class="theme-toggler">
                    <i class='bx bx-sun'></i>
                    <i class='bx bx-moon'></i>
                </div>
                <div class="profile">
                    <div class="info">
                        <p>Hey, <b>Aliza</b></p>
                        <small class="text-muted">Admin</small>
                    </div>
                    <div class="profile-photo">
                        <img src="p.jpeg">
                    </div>
                </div>
            </div>

            <div class="sales-analytics" style=" width: 500px;">
                <h2>Sales Analytics</h2>
                <div class="item online" style="background-color: rgba(128, 128, 128, 0.288);">
                    <div class="icon">
                        <i class='bx bx-cart-alt'></i>
                    </div>
                    <div class="right">
                        <div class="info">
                            <h3>Online Orders</h3>
                            <small class="text-muted">Last 24 Hours</small>
                        </div>
                        <h5 class="success">+39%</h5>
                        <h3>3849</h3>
                    </div>
                </div>

                <div class="item offline" style="background-color: rgba(128, 128, 128, 0.288);">
                    <div class="icon">
                        <i class='bx bx-store-alt'></i>
                    </div>
                    <div class="right">
                        <div class="info">
                            <h3>Offline Orders</h3>
                            <small class="text-muted">Last 24 Hours</small>
                        </div>
                        <h5 class="danger">-17%</h5>
                        <h3>1100</h3>
                    </div>
                </div>

                <div class="item customers" style="background-color: rgba(128, 128, 128, 0.288);">
                    <div class="icon">
                        <i class='bx bxs-contact'></i>
                    </div>
                    <div class="right">
                        <div class="info">
                            <h3>New Customers</h3>
                            <small class="text-muted">Last 24 Hours</small>
                        </div>
                        <h5 class="success">+25%</h5>
                        <h3>849</h3>
                    </div>
                </div>
        </div>
    </body>
</html>
