<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dash.css">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.1/css/boxicons.min.css" rel="stylesheet">
    <script src="dash.js"></script>
    <script src="orders.js"></script>
    <title>Admin Dashboard</title>
</head>

<body>
    <div class="container">
        <div class="menu-toggle" id="menu-toggle-btn">
            <i class='bx bx-menu'></i> <!-- Menu Icon (hamburger) -->
        </div>
        <aside class="hide">
            <div class="top">
                <div class="logo">
                    <img src="logo.webp">
                    <h2>EGA<span class="danger">TOR</span></h2>
                </div>
                <div class="close" id="close-btn">
                    <i class='bx bx-message-square-x'></i>
                </div>
            </div>
            <div class="sidebar">
                <a href="index.html" class="active">
                    <i class='bx bxs-dashboard'></i>
                    <h3>Dashboard</h3>
                </a>
                <a href="Dashboard.html">
                    <i class='bx bxs-contact'></i>
                    <h3>All</h3>
                </a>
                <a href="msg.html">
                    <i class='bx bx-receipt'></i>
                    <h3>Customers</h3>
                </a>
                <a href="ana.html">
                    <i class='bx bx-analyse'></i>
                    <h3>Analytics</h3>
                </a>
                <a href="msg.html">
                    <i class='bx bx-envelope'></i>
                    <h3>Messages</h3>
                    <span class="message-count">26</span>
                </a>
                <a href="prod.html">
                    <i class='bx bxl-product-hunt'></i>
                    <h3>Products</h3>
                </a>
                <a href="report.html">
                    <i class='bx bxs-report'></i>
                    <h3>Reports</h3>
                </a>
                <a href="add_prod.html">
                    <i class='bx bx-plus'></i>
                    <h3>Add Product</h3>
                </a>
                <a href="set.html">
                    <i class='bx bx-log-out'></i>
                    <h3>Logout</h3>
                </a>
            </div>
        </aside>

        <main>
            <h1>Dashboard</h1>
            <div class="date">
                <input type="date">
            </div>
            <div class="insights">
                <div class="sales">
                    <i class='bx bx-analyse'></i>
                    <div class="middle">
                        <div class="left">
                            <h3>Total Sales</h3>
                            <h1>$25,024</h1>
                        </div>
                        <div class="progress">
                            <svg>
                                <circle cx='38' cy='38' r='36'></circle>
                            </svg>
                            <div class="number">
                                <p>81%</p>
                            </div>
                        </div>
                    </div>
                    <small class="text-muted">Last 24 Hours</small>
                </div>

                <div class="expensees">
                    <i class='bx bx-bar-chart-alt-2'></i>
                    <div class="middle">
                        <div class="left">
                            <h3>Total Expenses</h3>
                            <h1>$14,160</h1>
                        </div>
                        <div class="progress">
                            <svg>
                                <circle cx='38' cy='38' r='36'></circle>
                            </svg>
                            <div class="number">
                                <p>62%</p>
                            </div>
                        </div>
                    </div>
                    <small class="text-muted">Last 24 Hours</small>
                </div>

                <div class="income">
                    <i class='bx bx-line-chart'></i>
                    <div class="middle">
                        <div class="left">
                            <h3>Total Income</h3>
                            <h1>$10,864</h1>
                        </div>
                        <div class="progress">
                            <svg>
                                <circle cx='38' cy='38' r='36'></circle>
                            </svg>
                            <div class="number">
                                <p>44%</p>
                            </div>
                        </div>
                    </div>
                    <small class="text-muted">Last 24 Hours</small>
                </div>

            </div>
        </main>
        <div class="right">
            <div class="top">
                <button id="menu-btn">
                    <i class='bx bx-menu'></i>
                </button>
                <div class="theme-toggler">
                    <i class='bx bx-sun'></i>
                    <i class='bx bx-moon'></i>
                </div>
                <div class="profile">
                    <div class="info">
                        <p>Hey, <b>Aliza</b></p>
                        <small class="text-muted">Admin</small>
                    </div>
                    <div class="profile-photo">
                        <img src="p.jpeg">
                    </div>
                </div>
            </div>
        </div>
</body>

</html>
